name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    uses: AtyaLibraries/github-workflows/.github/workflows/dotnet-package-ci.yml@f6190353bf05e780bd2b98a0980fe1a7b0e93a27 # v1
    with:
      solution: ./Abstractions.sln
      test-project: ./tests/Abstractions.UnitTests/Abstractions.UnitTests.csproj
      package-project: ./src/Abstractions/Abstractions.csproj
      fail-on-coverage: true
      coverage-line-min: 90
      coverage-branch-min: 80
